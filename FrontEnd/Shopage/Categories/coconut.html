<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coconut - Gabay Halaman</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #f2f6ec; color: #1f2f14; }
        .wrap { max-width: 1300px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
        h1 { font-family: 'Inria Serif', serif; font-size: clamp(2rem, 5vw, 3.3rem); margin: 0; text-align: center; }
        .subtitle { text-align: center; margin: 0.75rem 0 2rem; font-size: 1.05rem; color: #486534; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2rem;
            justify-content: center;
            align-items: start;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d5e3c2;
            border-radius: 14px;
            padding: 0.85rem;
            box-shadow: 0 12px 22px rgba(40, 75, 20, 0.08);
            text-align: center;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 0.7rem;
            display: block;
        }
        .name { font-size: 1.12rem; min-height: 2.8rem; margin-bottom: 0.2rem; color: #1f2f14; }
        .price { font-weight: 600; color: #365821; }
        .card { text-decoration: none; color: inherit; display: flex; flex-direction: column; cursor: pointer; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(40, 75, 20, 0.15); }
        .actions { display: flex; justify-content: center; margin-top: 2rem; }
        .btn { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 999px; text-decoration: none; background: #3c5830; color: #fff; font-weight: 700; }
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Dwarf Coconut Collection</h1>
        <p class="subtitle">Healthy coconut varieties with aligned cards and wider spacing for easier browsing.</p>

        <section class="grid" aria-label="Coconut plants">
            <a href="../product-detail.html?id=31" class="card">
                <img src="https://images.unsplash.com/photo-1720798377880-2a1b656848ce?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Golden Coconut">
                <h2 class="name">Golden Coconut</h2>
                <p class="price">₱400.00</p>
            </a>
            <a href="../product-detail.html?id=32" class="card">
                <img src="https://images.unsplash.com/photo-1720798377880-2a1b656848ce?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Tacunan Variety">
                <h2 class="name">Tacunan Variety</h2>
                <p class="price">₱550.00</p>
            </a>
            <a href="../product-detail.html?id=33" class="card">
                <img src="https://images.unsplash.com/photo-1720798377880-2a1b656848ce?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Catigan Variety">
                <h2 class="name">Catigan Variety</h2>
                <p class="price">₱250.00</p>
            </a>
        </section>

        <div class="actions">
            <a class="btn" href="../../LandingPage/landingpage.html">Back to Home</a>
        </div>
    </div>
</body>
</html>
