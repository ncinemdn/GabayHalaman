<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Gabay Halaman</title>
  <style>
    :root {
      --bg-1: #f4f7f2;
      --bg-2: #e1ead9;
      --leaf-dark: #4f6f45;
      --text: #223125;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 10% 10%, rgba(111, 149, 96, 0.24), transparent 55%),
        radial-gradient(900px 600px at 90% 80%, rgba(79, 111, 69, 0.22), transparent 55%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
    }

    .loader-wrap {
      width: min(420px, 92vw);
      padding: 2.25rem 2rem;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 48px rgba(34, 49, 37, 0.12);
      text-align: center;
    }

    .dot-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin: 0 auto 1rem;
      height: 28px;
    }

    .dot-loader span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--leaf-dark);
      opacity: 0.35;
      animation: pulse 0.9s ease-in-out infinite;
    }

    .dot-loader span:nth-child(2) {
      animation-delay: 0.12s;
    }

    .dot-loader span:nth-child(3) {
      animation-delay: 0.24s;
    }

    .title {
      margin: 0;
      font-size: clamp(1.2rem, 1rem + 1vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--leaf-dark);
    }

    .subtitle {
      margin: 0.55rem 0 0;
      font-size: 0.96rem;
      opacity: 0.86;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: translateY(0) scale(0.9);
        opacity: 0.35;
      }
      50% {
        transform: translateY(-3px) scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main class="loader-wrap" aria-live="polite" aria-busy="true">
    <div class="dot-loader" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <h1 class="title">Preparing your garden journey</h1>
    <p class="subtitle">Redirecting you to Gabay Halaman...</p>
  </main>

  <script>
    window.setTimeout(function () {
      window.location.replace("/FrontEnd/LandingPage/landingpage.html");
    }, 1300);
  </script>
</body>
</html>
