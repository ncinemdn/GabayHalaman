<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabay Halaman - Your Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fff; }
        .font-serif { font-family: 'Playfair Display', serif; }
        :root { --brand-green: #7ea33d; }
        .btn-green { background-color: var(--brand-green); transition: opacity 0.2s; }
        .btn-green:hover { opacity: 0.9; }
        .card-shadow { box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .item-card { background-color: #f6f6f8; border-radius: 24px; }
        
        /* Modal Styles */
        #deliveryModal { transition: opacity 0.3s ease; }
        .modal-content { transform: translateY(20px); transition: transform 0.3s ease; }
        #deliveryModal.active .modal-content { transform: translateY(0); }
    </style>
</head>
<body class="pb-20">

    <div class="bg-[#7ea33d] h-[180px] w-full absolute top-0 left-0"></div>
    <div class="relative z-20 max-w-[1200px] mx-auto pt-6 px-4">
        <div class="bg-white rounded-full py-3 px-8 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
                <img src="bb.png" alt="Gabay Halaman Logo" class="w-10 h-10 rounded-full border border-gray-100 object-cover">
                <span class="font-bold text-sm tracking-widest uppercase">Gabay <span class="text-[#7ea33d]">• Halaman</span></span>
            </div>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#" class="hover:text-green-600">Home</a>
                <a href="#" class="hover:text-green-600">Shop ▼</a>
                <a href="#" class="hover:text-green-600">More ▼</a>
            </nav>
            <div class="flex items-center gap-5 text-gray-500">
                <span>🔍</span>
                <span class="relative">🛒 <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] rounded-full px-1">0</span></span>
            </div>
        </div>
    </div>

    <main class="relative z-10 max-w-[1100px] mx-auto mt-24 px-6">
        <h1 class="font-serif text-[42px] text-[#1a1a1a] mb-10">Your cart</h1>

        <div class="flex flex-col lg:flex-row gap-10 items-start">
            <div class="w-full lg:w-[62%] space-y-4">
                <div id="cart-list" class="space-y-4"></div>

                <div class="mt-8 p-8 item-card">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold">Delivery Details</h2>
                        <button onclick="openModal()" class="text-xs text-[#7ea33d] font-bold underline">Change</button>
                    </div>
                    <div id="deliveryInfo" class="text-gray-600 text-sm leading-relaxed"></div>
                </div>
            </div>

            <div class="w-full lg:w-[38%]">
                <div class="bg-white rounded-[32px] p-10 card-shadow border border-gray-50 sticky top-10">
                    <h2 class="font-serif text-2xl mb-8">Order Summary</h2>
                    <div class="space-y-4 text-sm font-medium text-gray-800">
                        <div class="flex justify-between">
                            <span class="text-gray-500" id="summary-items-text">Subtotal (0 items)</span>
                            <span id="subtotal-price">₱ 0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Shipping</span>
                            <span class="text-green-600 font-bold">FREE</span>
                        </div>
                    </div>
                    <div class="h-[1px] bg-gray-100 my-8"></div>
                    <div class="flex justify-between items-center mb-10">
                        <span class="text-lg font-bold">Total</span>
                        <span id="total-price" class="text-lg font-bold text-[#7ea33d]">₱ 0.00</span>
                    </div>
                    <div class="space-y-3">
                        <button onclick="openModal()" id="add-details-btn" class="w-full py-4 rounded-2xl text-white btn-green font-semibold text-sm">
                            Add Delivery Details
                        </button>
                        <button onclick="placeOrder()" id="place-order-btn" class="w-full py-4 rounded-2xl bg-[#a3a9b1] text-white font-semibold text-sm cursor-not-allowed">
                            Place Order
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="deliveryModal" class="fixed inset-0 z-[100] hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="modal-content bg-white w-full max-w-md rounded-[32px] p-8 shadow-2xl">
            <h2 class="font-serif text-2xl mb-6">Delivery Information</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase font-bold text-gray-400 ml-1">Full Name</label>
                    <input type="text" id="modal-name" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-[#7ea33d] outline-none" placeholder="Juan Dela Cruz">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-bold text-gray-400 ml-1">Phone Number</label>
                    <input type="text" id="modal-phone" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-[#7ea33d] outline-none" placeholder="0912 345 6789">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-bold text-gray-400 ml-1">Email Address</label>
                    <input type="email" id="modal-email" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-[#7ea33d] outline-none" placeholder="juan@example.com">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-bold text-gray-400 ml-1">Shipping Address</label>
                    <textarea id="modal-address" rows="3" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-[#7ea33d] outline-none" placeholder="House No., Street, Barangay, City"></textarea>
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">Cancel</button>
                <button onclick="saveDelivery()" class="flex-1 py-3 rounded-xl text-white btn-green font-bold text-sm">Save Details</button>
            </div>
        </div>
    </div>

    <script>
        // Data Handling (Updated to use drac.png as requested)
        let cart = JSON.parse(localStorage.getItem("cart")) || [
            { id: 1, name: "Dracaena Anita", price: 499, qty: 1, img: "drac.png" },
            { id: 2, name: "Dracaena Anita", price: 499, qty: 1, img: "drac.png" },
            { id: 3, name: "Dracaena Anita", price: 499, qty: 1, img: "drac.png" }
        ];
        let delivery = JSON.parse(localStorage.getItem("delivery")) || null;

        function renderUI() {
            // Cart Items
            const cartList = document.getElementById("cart-list");
            let total = 0, count = 0;
            cartList.innerHTML = cart.map((item, i) => {
                total += item.price * item.qty;
                count += item.qty;
                return `
                <div class="item-card p-4 flex items-center justify-between">
                    <div class="flex items-center gap-6">
                        <img src="${item.img}" class="w-24 h-24 object-cover rounded-2xl">
                        <div>
                            <h3 class="font-bold text-gray-800">${item.name}</h3>
                            <p class="font-bold mt-1">₱ ${item.price}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="bg-gray-200/50 flex items-center rounded-full px-4 py-1.5 gap-4 font-bold text-sm">
                            <button onclick="updateQty(${i},-1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQty(${i},1)">+</button>
                        </div>
                        <button onclick="removeItem(${i})" class="text-red-400 ml-2">🗑</button>
                    </div>
                </div>`;
            }).join("");

            // Summary
            document.getElementById("cart-count").innerText = count;
            document.getElementById("summary-items-text").innerText = `Subtotal (${count} items)`;
            document.getElementById("subtotal-price").innerText = `₱ ${total.toLocaleString()}.00`;
            document.getElementById("total-price").innerText = `₱ ${total.toLocaleString()}.00`;

            // Delivery Block
            const infoDiv = document.getElementById("deliveryInfo");
            const placeBtn = document.getElementById("place-order-btn");
            const addBtn = document.getElementById("add-details-btn");

            if(delivery) {
                infoDiv.innerHTML = `
                    <p><b>${delivery.name}</b> • ${delivery.phone}</p>
                    <p>${delivery.email}</p>
                    <p class="mt-1">${delivery.address}</p>`;
                placeBtn.classList.replace("bg-[#a3a9b1]", "bg-yellow-500");
                placeBtn.classList.remove("cursor-not-allowed");
                addBtn.innerText = "Edit Delivery Details";
            } else {
                infoDiv.innerHTML = `<p class="italic opacity-50">No delivery information provided yet.</p>`;
            }
        }

        // Logic Functions
        window.updateQty = (i, d) => {
            if(cart[i].qty + d > 0) {
                cart[i].qty += d;
                localStorage.setItem("cart", JSON.stringify(cart));
                renderUI();
            }
        };

        window.removeItem = (i) => {
            cart.splice(i, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            renderUI();
        };

        // Modal Functions
        window.openModal = () => {
            const modal = document.getElementById("deliveryModal");
            modal.classList.remove("hidden");
            setTimeout(() => modal.classList.add("active"), 10);
            if(delivery) {
                document.getElementById("modal-name").value = delivery.name;
                document.getElementById("modal-phone").value = delivery.phone;
                document.getElementById("modal-email").value = delivery.email;
                document.getElementById("modal-address").value = delivery.address;
            }
        };

        window.closeModal = () => {
            const modal = document.getElementById("deliveryModal");
            modal.classList.remove("active");
            setTimeout(() => modal.classList.add("hidden"), 300);
        };

        window.saveDelivery = () => {
            const data = {
                name: document.getElementById("modal-name").value,
                phone: document.getElementById("modal-phone").value,
                email: document.getElementById("modal-email").value,
                address: document.getElementById("modal-address").value
            };

            if(!data.name || !data.address) {
                alert("Please provide at least a Name and Address.");
                return;
            }

            delivery = data;
            localStorage.setItem("delivery", JSON.stringify(data));
            renderUI();
            closeModal();
        };

        window.placeOrder = () => {
            if(!delivery) return alert("Please add delivery details first!");
            // When order is placed, clear cart and redirect to cart page
            alert("Order placed successfully!");
            localStorage.removeItem("cart"); // Clear only the cart, keeping delivery details
            window.location.href = "cart.html";
        };

        renderUI();
    </script>
</body>
</html>
