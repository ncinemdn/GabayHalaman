body {

}

.nav-shadow { box-shadow: 0 6px 25px rgba(0,0,0,0.08); }
.card-shadow { box-shadow: 0 12px 30px rgba(0,0,0,0.06); }

.btn-green { background: var(--green); }
.btn-green:hover { filter: brightness(0.95); }

.header {
    background: #7fa843;
    padding: 20px 0;
}

.header-inner {
    background-color: #ffffff;
    border-radius: 50px;
    padding: 12px 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.logo-section {

    align-items: center;

    text-decoration: none;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
}

.brand-text {
    height: 24px;
}

.nav {
    display: flex;
    gap: 40px;
}

.nav a {
    font-family: 'Inria Serif', serif;
    font-weight: 700;
    font-size: 18px;
    color: black;
    text-decoration: none;
    transition: 0.2s;
}

.nav a:hover {
    opacity: 0.6;
}

.nav-dropdown {
    position: relative;
}

.nav-dropdown-toggle {
    font-family: 'Inria Serif', serif;
    font-weight: 700;
    font-size: 20px;
    color: black;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
}

.nav-dropdown-menu {
    display: block;
    position: absolute;
    top: calc(100% + 5px);
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    min-width: 170px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    padding: 10px 0;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
}

.nav-dropdown-menu a {
    display: block;
    padding: 10px 16px;
    font-size: 16px;
    white-space: nowrap;
    pointer-events: auto;
}

.nav-dropdown.is-open .nav-dropdown-menu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
}

.cart-dropdown-menu {
    left: auto;
    right: 0;
    transform: translateY(8px);
    min-width: 170px;
}

.nav-dropdown.cart-dropdown.is-open .cart-dropdown-menu {
    transform: translateY(0);
}

.header-icons {
    display: flex;
    align-items: center;
    gap: 18px;
}

.icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
}

.icon-btn svg {
    width: 20px;
    height: 20px;
}

.icon-btn:hover {
    opacity: 0.6;
}

@media (max-width: 1024px) {
    .nav {
        display: none;
    }
}

@media (max-width: 768px) {

        height: 60px;
    }

        width: 20px;
        height: 20px;
    }
}

.page-wrap {

}

.summary-panel {

.summary-title {

    font-size: 1.4rem;
    font-weight: 700;

}

.summary-row {

}

.summary-note {

}

.summary-divider {

}

.summary-total {

.summary-btn {

.summary-btn:hover {

.summary-btn.delivery {

.item-copy {

.del-btn:hover {

.cart-empty-icon {

    color: #5d7c2e;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cart-empty-icon svg {
    width: 38px;
    height: 38px;
}

.cart-empty-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 0.45rem;
    color: #273817;
}

.cart-empty-desc {
    font-size: 15px;
    color: #556b47;
    margin-bottom: 1rem;
}

.cart-empty-actions {
    display: flex;
    justify-content: center;
    gap: 0.8rem;
    flex-wrap: wrap;

.cart-empty-btn {
    display: inline-block;

    border-radius: 999px;
    padding: 0.62rem 1.2rem;
    font-weight: 600;

.cart-empty-btn:hover {
    transform: translateY(-1px);
}

.cart-empty-btn.primary {

.cart-empty-btn.primary:hover {

.cart-empty-btn.secondary {

    color: #416025;
    border: 1px solid rgba(126, 163, 61, 0.45);
}

.order-now-toast-stack {
    position: fixed;
    top: 96px;
    right: 24px;
    z-index: 1350;
    pointer-events: none;
}

.order-now-toast {
    position: relative;
    width: min(360px, calc(100vw - 32px));
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    padding: 0.95rem 1rem 1rem;
    border-radius: 18px;
    border: 1px solid rgba(126, 163, 61, 0.28);
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 18px 32px rgba(26, 42, 20, 0.16);
    backdrop-filter: blur(10px);
    overflow: hidden;
    opacity: 0;
    transform: translate3d(16px, -8px, 0);
    transition: opacity 0.22s ease, transform 0.22s ease;
}

.order-now-toast.is-visible {
    opacity: 1;
    transform: translate3d(0, 0, 0);
}

.order-now-toast-badge {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #4b6a2b;
    background: linear-gradient(145deg, #edf6df, #f8fbf2);
    border: 1px solid rgba(126, 163, 61, 0.3);
}

.order-now-toast-badge svg {
    width: 18px;
    height: 18px;
}

.order-now-toast-copy {
    min-width: 0;
    flex: 1;
}

.order-now-toast-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: #213319;

.order-now-toast-text {
    margin-top: 0.16rem;
    font-size: 0.82rem;
    line-height: 1.45;
    color: #5c6d53;
}

.order-now-toast-progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background: linear-gradient(90deg, #7ea33d, #b8cf87);
    transform-origin: left center;
}

@keyframes orderNowToastCountdown {
    from {
        transform: scaleX(1);
    }

    to {
        transform: scaleX(0);
    }
}

@media (max-width: 1024px) {
    .cart-layout {
        flex-direction: column;
    }
}

@media (max-width: 768px) {
    .page-wrap {
        margin-top: 14px;
        padding: 0.95rem 0.72rem 1.5rem;
    }

    .page-title {
        font-size: 1.6rem;
        margin-bottom: 0.9rem;
    }

    .cart-item-card {
        align-items: flex-start;
        flex-direction: column;
    }

    .cart-item-main {
        width: 100%;
    }

    .item-actions {
        width: 100%;

    }

    .order-now-toast-stack {
        top: 84px;

        left: 12px;
    }

    .order-now-toast {
        width: 100%;
    }

    .summary-panel {
        top: auto;
        position: static;
    }
}
</style>

<script>
let orderItem = null;
let isSubmittingOrderNow = false;

const DELETE_TOAST_DURATION = 3200;
const ORDER_TOAST_DURATION = 1800;
const orderNowToastRegion = document.getElementById('orderNowToastRegion');

let orderNowToastHideTimeout = null;
let orderNowToastRemoveTimeout = null;

function formatCurrency(amount) {
    const safeAmount = Number(amount || 0);
    const pesoSymbol = String.fromCharCode(8369);
    return `${pesoSymbol}${safeAmount.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function getOrderItem() {
    const raw = localStorage.getItem('orderNowItem');
    if (!raw) {
        return null;
    }

    try {
        return JSON.parse(raw);
    } catch (error) {
        return null;
    }
}

function showOrderNowToast(title, message, duration) {
    if (!orderNowToastRegion) {
        return;
    }

    window.clearTimeout(orderNowToastHideTimeout);
    window.clearTimeout(orderNowToastRemoveTimeout);

    orderNowToastRegion.innerHTML = '';

    const toast = document.createElement('section');
    toast.className = 'order-now-toast';
    toast.setAttribute('role', 'status');
    toast.innerHTML = `
        <div class="order-now-toast-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M7 12.5L10.1 15.6L17.25 8.45" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="order-now-toast-copy">
            <p class="order-now-toast-title"></p>
            <p class="order-now-toast-text"></p>
        </div>
        <div class="order-now-toast-progress"></div>
    `;

    const titleElement = toast.querySelector('.order-now-toast-title');
    const textElement = toast.querySelector('.order-now-toast-text');
    if (titleElement) {
        titleElement.textContent = title;
    }
    if (textElement) {
        textElement.textContent = message;
    }

    orderNowToastRegion.appendChild(toast);

    requestAnimationFrame(() => {
        toast.classList.add('is-visible');
        const progressBar = toast.querySelector('.order-now-toast-progress');
        if (progressBar) {
            progressBar.style.animation = `orderNowToastCountdown ${duration}ms linear forwards`;
        }
    });

    orderNowToastHideTimeout = window.setTimeout(() => {
        toast.classList.remove('is-visible');
        orderNowToastRemoveTimeout = window.setTimeout(() => {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 220);
    }, duration);
}

function showDeleteToast(itemName) {
    showOrderNowToast('Item removed', `${itemName} was removed from your Order Now selection.`, DELETE_TOAST_DURATION);
}

function showOrderPlacedToast() {
    showOrderNowToast('Order placed', 'Your order was placed successfully. Opening your purchases...', ORDER_TOAST_DURATION);
}

function renderOrderItem() {
    const container = document.getElementById('orderNowContainer');
    const summaryColumn = document.getElementById('summaryColumn');

    if (summaryColumn) {
        summaryColumn.style.display = orderItem ? '' : 'none';
    }
    if (container) {
        container.classList.toggle('full-width', !orderItem);
    }

    if (!orderItem) {
        container.innerHTML = `
            <section class="cart-empty-shell">
                <div class="cart-empty-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 4H5L7 15H17L20 7H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="10" cy="19" r="1.5" fill="currentColor"/>
                        <circle cx="17" cy="19" r="1.5" fill="currentColor"/>
                    </svg>
                </div>
                <h2 class="cart-empty-title">No item selected</h2>
                <p class="cart-empty-desc">Choose a plant from the shop to continue with Order Now.</p>
                <div class="cart-empty-actions">
                    <a href="../Shopage/Shoppage.html" class="cart-empty-btn primary">Browse Shop</a>
                </div>
            </section>
        `;
        updateSummary();
        return;
    }

    container.innerHTML = `
        <div class="cart-item-card">
            <div class="cart-item-main">
                <img src="${orderItem.image}" class="item-thumb" alt="${orderItem.name}">
                <div class="item-copy">
                    <h3 class="item-name">${orderItem.name}</h3>
                    <p class="item-meta">Size: ${String(orderItem.size || 'Medium')}</p>
                    <p class="item-price">${formatCurrency(orderItem.price)}</p>
                </div>
            </div>

            <div class="item-actions">
                <div class="qty-chip">
                    <button class="qty-btn" onclick="changeQty(-1)" aria-label="Decrease quantity">&minus;</button>
                    <span class="qty-value">${orderItem.quantity}</span>
                    <button class="qty-btn" onclick="changeQty(1)" aria-label="Increase quantity">+</button>
                </div>

                <button onclick="clearOrderNow()" class="del-btn" aria-label="Delete item">
                    <svg viewBox="0 0 16 19" fill="currentColor" aria-hidden="true">
                        <path d="M3.45775 18.6345C2.75908 18.6345 2.17475 18.3996 1.70475 17.9298C1.23492 17.4598 1 16.8754 1 16.1768V3.2345H0V1.0845H5.2V0H11.35V1.0845H16.55V3.2345H15.55V16.1768C15.55 16.8606 15.3113 17.4412 14.834 17.9185C14.3567 18.3958 13.7761 18.6345 13.0923 18.6345H3.45775ZM13.4 3.2345H3.15V16.1768C3.15 16.2666 3.17883 16.3403 3.2365 16.398C3.29417 16.4557 3.36792 16.4845 3.45775 16.4845H13.0923C13.1693 16.4845 13.2398 16.4524 13.3038 16.3883C13.3679 16.3243 13.4 16.2538 13.4 16.1768V3.2345ZM5.129 14.4595H7.27875V5.2595H5.129V14.4595ZM9.27125 14.4595H11.421V5.2595H9.27125V14.4595Z"/>
                    </svg>
                </button>
            </div>
        </div>
    `;

    updateSummary();
}

function changeQty(delta) {
    if (!orderItem) {
        return;
    }

    const nextQty = Math.max(1, Number(orderItem.quantity || 1) + delta);
    const stockLimit = Math.max(0, Number(orderItem.availableStock || 0));
    orderItem.quantity = stockLimit > 0 ? Math.min(stockLimit, nextQty) : nextQty;
    localStorage.setItem('orderNowItem', JSON.stringify(orderItem));
    renderOrderItem();
}

function clearOrderNow() {
    if (!orderItem) {
        return;
    }

    const removedItemName = orderItem.name || 'The item';
    localStorage.removeItem('orderNowItem');
    orderItem = null;
    renderOrderItem();
    updateButtonStates();
    showDeleteToast(removedItemName);
}

function updateSummary() {
    const qty = orderItem ? Number(orderItem.quantity || 1) : 0;
    const total = orderItem ? Number(orderItem.price || 0) * qty : 0;

    document.getElementById('count').innerText = `Subtotal (${qty} ${qty === 1 ? 'item' : 'items'})`;
    document.getElementById('subtotal').innerText = formatCurrency(total);
    document.getElementById('total').innerText = formatCurrency(total);
}

function generatePurchaseOrderId(existingOrders) {
    const fallbackNumber = 1001;
    const maxExisting = existingOrders.reduce(function(maxValue, order) {
        const parsed = Number(String(order.orderId || '').replace(/[^0-9]/g, ''));
        if (!Number.isFinite(parsed)) {
            return maxValue;
        }
        return Math.max(maxValue, parsed);
    }, 0);

    return '#ORD-' + String(Math.max(fallbackNumber, maxExisting + 1));
}

function createEstimatedDeliveryWindow(createdAtValue) {
    const baseDate = new Date(createdAtValue || Date.now());

    if (Number.isNaN(baseDate.getTime())) {
        return null;
    }

    const earliest = new Date(baseDate);
    earliest.setHours(12, 0, 0, 0);
    earliest.setDate(earliest.getDate() + 3);

    const latest = new Date(baseDate);
    latest.setHours(12, 0, 0, 0);
    latest.setDate(latest.getDate() + 5);

    return {
        earliest: earliest.toISOString(),
        latest: latest.toISOString()
    };
}

async function saveOrderNowPurchase() {
    if (!orderItem) {
        return;
    }

    const deliveryDetails = JSON.parse(localStorage.getItem('deliveryDetails') || '{}');
    const existingPurchases = JSON.parse(localStorage.getItem('purchaseOrders') || '[]');
    const stockSyncApi = window.GHStockSync;
    const createdAt = new Date().toISOString();

    if (!stockSyncApi || typeof stockSyncApi.reservePurchaseStock !== 'function' || typeof stockSyncApi.rollbackReservedPurchaseStock !== 'function') {
        throw new Error('Stock sync is unavailable. Please refresh the page and try again.');
    }

    const purchaseEntry = {
        id: String(Date.now()) + '-' + String(Math.floor(Math.random() * 100000)),
        orderId: generatePurchaseOrderId(existingPurchases),
        customerName: deliveryDetails.fullName || 'Guest Customer',
        validIdAttachment: deliveryDetails.validIdAttachment || '',
        validIdFileName: deliveryDetails.validIdFileName || '',
        validIdContentType: deliveryDetails.validIdContentType || '',
        items: [{
            plantId: Number(orderItem.plantId || orderItem.id || 0),
            plantSizeId: Number(orderItem.plantSizeId || 0) || null,
            name: orderItem.name,
            size: orderItem.size || '',
            qty: Number(orderItem.quantity || 1),
            price: Number(orderItem.price || 0),
            image: orderItem.image
        }],
        totalAmount: Number(orderItem.price || 0) * Number(orderItem.quantity || 1),
        paymentStatus: 'unpaid',
        orderStatus: 'pending',
        requestType: 'purchase',
        createdAt: createdAt,
        estimatedDeliveryWindow: createEstimatedDeliveryWindow(createdAt),
        deliveryDetails: deliveryDetails
    };

    const stockReservation = await stockSyncApi.reservePurchaseStock(purchaseEntry.items);

    try {
        await createBackendRequest('purchase', purchaseEntry, { requireSuccess: true });
    } catch (error) {
        await stockSyncApi.rollbackReservedPurchaseStock(stockReservation);
        throw error;
    }

    existingPurchases.unshift(purchaseEntry);
    localStorage.setItem('purchaseOrders', JSON.stringify(existingPurchases));

    return purchaseEntry;
}

async function createBackendRequest(requestType, order, options = {}) {
    if (typeof requestsAPI === 'undefined') {
        const message = 'Order API is not available.';
        console.warn(message);
        if (options.requireSuccess) {
            throw new Error(message);
        }
        return null;
    }

    const deliveryDetails = order.deliveryDetails || {};
    const clientId = await resolveClientId(deliveryDetails, order.clientId);

    if (!Number.isFinite(Number(clientId)) || Number(clientId) <= 0) {
        const message = 'Unable to match your delivery details to a client record.';
        console.warn(message);
        if (options.requireSuccess) {
            throw new Error(message);
        }
        return null;
    }

    order.clientId = Number(clientId);

    const requestPayload = {
        client_id: Number(clientId),
        request_type: requestType,
        request_status: order.orderStatus || 'pending',
        payment_status: order.paymentStatus || 'unpaid',
        total_amount: Math.round(order.totalAmount || 0),
        valid_id_attachment: order.validIdAttachment || deliveryDetails.validIdAttachment || null,
        valid_id_file_name: order.validIdFileName || deliveryDetails.validIdFileName || null,
        valid_id_content_type: order.validIdContentType || deliveryDetails.validIdContentType || null,
        request_date: new Date().toISOString(),
        last_updated: new Date().toISOString()
    };

    const requestIdentityApi = window.GHRequestIdentity;
    const knownRequestIds = requestIdentityApi && typeof requestIdentityApi.captureKnownRequestIds === 'function'
        ? await requestIdentityApi.captureKnownRequestIds()
        : new Set();

    try {
        const created = await requestsAPI.create(requestPayload);
        if (options.requireSuccess && created === false) {
            throw new Error('Unable to save order to the database.');
        }

        if (created !== false && requestIdentityApi && typeof requestIdentityApi.resolveCreatedRequestId === 'function') {
            const backendRequestId = await requestIdentityApi.resolveCreatedRequestId(created, requestPayload, knownRequestIds);
            if (backendRequestId) {
                order.backendRequestId = String(backendRequestId);
            }
        }

        return created;
    } catch (error) {
        console.warn('Unable to persist order to backend:', error);
        if (options.requireSuccess) {
            throw error;
        }
        return null;
    }
}

async function resolveClientId(deliveryDetails = {}, fallbackClientId = 0) {
    const MAX_CLIENT_CONTACT_NUMBER = 2147483647;
    const explicitClientId = Number(deliveryDetails.clientId || fallbackClientId || 0);
    if (Number.isFinite(explicitClientId) && explicitClientId > 0) {
        return explicitClientId;
    }

    if (typeof clientsAPI === 'undefined') {
        return null;
    }

    const fullName = String(deliveryDetails.fullName || '').trim();
    const email = String(deliveryDetails.email || '').trim().toLowerCase();
    const phoneDigits = String(deliveryDetails.phone || '').replace(/\D/g, '');
    const parsedContactNumber = Number(phoneDigits);
    const contactNumber = Number.isFinite(parsedContactNumber) && parsedContactNumber <= MAX_CLIENT_CONTACT_NUMBER
        ? parsedContactNumber
        : 0;

    const matchExistingClient = (clients) => {
        if (!Array.isArray(clients)) {
            return null;
        }

        return clients.find((client) => {
            const clientEmail = String(client.email || '').trim().toLowerCase();
            const clientName = String(client.full_name || '').trim();
            const clientContact = String(client.contact_number || '').replace(/\D/g, '');

            if (email && clientEmail && clientEmail === email) {
                return true;
            }

            if (fullName && clientName === fullName && phoneDigits && clientContact === phoneDigits) {
                return true;
            }

            return false;
        }) || null;
    };

    try {
        const existingClients = await clientsAPI.getAll();
        const existingClient = matchExistingClient(existingClients);
        if (existingClient && Number(existingClient.client_id) > 0) {
            return Number(existingClient.client_id);
        }

        if (!fullName || !email) {
            return null;
        }

        await clientsAPI.create({
            full_name: fullName,
            email,
            contact_number: Number.isFinite(contactNumber) ? contactNumber : 0,
            created_at: new Date().toISOString()
        });
    } catch (error) {
        console.warn('Unable to resolve client_id for request:', error);
    }

    try {
        const refreshedClients = await clientsAPI.getAll();
        const createdClient = matchExistingClient(refreshedClients);
        if (createdClient && Number(createdClient.client_id) > 0) {
            return Number(createdClient.client_id);
        }
    } catch (error) {
        console.warn('Unable to verify created client record:', error);
    }

    return null;
}

async function handleOrderNow() {
    if (!orderItem || isSubmittingOrderNow) {
        return;
    }

    isSubmittingOrderNow = true;

    try {
        await saveOrderNowPurchase();
        localStorage.removeItem('orderNowItem');
        orderItem = null;
        renderOrderItem();
        updateButtonStates();
        showOrderPlacedToast();
        await new Promise(resolve => window.setTimeout(resolve, ORDER_TOAST_DURATION));
        window.location.href = '../OrderPage/orderpage.html';
    } catch (error) {
        console.error('Failed to place order-now purchase:', error);
        alert(error?.message || 'Unable to place your order. Please try again.');
    } finally {
        isSubmittingOrderNow = false;
        updateButtonStates();
    }
}

function updateButtonStates() {
    const deliveryDetails = localStorage.getItem('deliveryDetails');
    const deliveryBtn = document.getElementById('deliveryBtn');
    const orderNowBtn = document.getElementById('orderNowBtn');

    deliveryBtn.textContent = deliveryDetails ? 'Edit Delivery Details' : 'Add Delivery Details';
    deliveryBtn.onclick = function() {
        window.location.href = 'details.html?return=order-now';
    };

    const canOrder = Boolean(deliveryDetails) && Boolean(orderItem);

    orderNowBtn.disabled = !canOrder;
    orderNowBtn.style.backgroundColor = canOrder ? '#ffc107' : '#d1d5db';
    orderNowBtn.style.color = canOrder ? '#000' : '#fff';
    orderNowBtn.style.cursor = canOrder ? 'pointer' : 'not-allowed';
    orderNowBtn.onclick = canOrder ? handleOrderNow : null;
}

window.addEventListener('DOMContentLoaded', function() {
    orderItem = getOrderItem();
    renderOrderItem();
    updateButtonStates();
});
</script>
