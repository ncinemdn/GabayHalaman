<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guava - Gabay Halaman</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #f2f6ec; color: #1f2f14; }
        .wrap { max-width: 1300px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
        h1 { font-family: 'Inria Serif', serif; font-size: clamp(2rem, 5vw, 3.3rem); margin: 0; text-align: center; }
        .subtitle { text-align: center; margin: 0.75rem 0 2rem; font-size: 1.05rem; color: #486534; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2rem;
            justify-content: center;
            align-items: start;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d5e3c2;
            border-radius: 14px;
            padding: 0.85rem;
            box-shadow: 0 12px 22px rgba(40, 75, 20, 0.08);
            text-align: center;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 0.7rem;
            display: block;
        }
        .name { font-size: 1.12rem; min-height: 2.8rem; margin-bottom: 0.2rem; color: #1f2f14; }
        .price { font-weight: 600; color: #365821; }
        .card { text-decoration: none; color: inherit; display: flex; flex-direction: column; cursor: pointer; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(40, 75, 20, 0.15); }
        .actions { display: flex; justify-content: center; margin-top: 2rem; }
        .btn { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 999px; text-decoration: none; background: #3c5830; color: #fff; font-weight: 700; }
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Guava & Dwarf Selections</h1>
        <p class="subtitle">Healthy guava varieties with aligned cards and wider spacing for easier browsing.</p>

        <section class="grid" aria-label="Guava plants">
            <a href="../product-detail.html?id=34" class="card"><img src="https://images.unsplash.com/photo-1689996647099-a7a0b67fd2f6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Red Guaple"><h2 class="name">Red Guaple</h2><p class="price">₱200.00</p></a>
            <a href="../product-detail.html?id=35" class="card"><img src="https://images.unsplash.com/photo-1689996647099-a7a0b67fd2f6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Green Guaple"><h2 class="name">Green Guaple</h2><p class="price">₱200.00</p></a>
            <a href="../product-detail.html?id=37" class="card"><img src="https://images.unsplash.com/photo-1705335834319-92a152363ea1?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Lychee"><h2 class="name">Lychee</h2><p class="price">₱350.00</p></a>
            <a href="../product-detail.html?id=39" class="card"><img src="https://images.unsplash.com/photo-1711641011417-3162af1e834c?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Hybrid Mulberry"><h2 class="name">Hybrid Mulberry</h2><p class="price">₱200.00</p></a>
            <a href="../product-detail.html?id=41" class="card"><img src="https://images.unsplash.com/photo-1660805376081-c6b01b7b78f1?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Red Cardinal Grapes"><h2 class="name">Red Cardinal Grapes</h2><p class="price">₱250.00</p></a>
            <a href="../product-detail.html?id=44" class="card"><img src="https://images.unsplash.com/photo-1651565919334-bf81165cd0a3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Sweet Guyabano"><h2 class="name">Sweet Guyabano</h2><p class="price">₱300.00</p></a>
        </section>

        <div class="actions">
            <a class="btn" href="../../LandingPage/landingpage.html">Back to Home</a>
        </div>
    </div>
</body>
</html>
