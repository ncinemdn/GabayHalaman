                                <button class="filter-btn" id="statusBtn">
                                    <span>Status</span>
                                    <svg class="chevron-icon" width="12" height="8" viewBox="0 0 12 8" fill="none">
                                        <path d="M6 8L0 1.51351L1.4 0L6 4.97297L10.6 0L12 1.51351L6 8Z" fill="black"/>
                                    </svg>
                                </button>
                                <button class="filter-btn" id="typesBtn">
                                    <span>Types</span>
                                    <svg class="chevron-icon" width="12" height="8" viewBox="0 0 12 8" fill="none">
                                        <path d="M6 8L0 1.51351L1.4 0L6 4.97297L10.6 0L12 1.51351L6 8Z" fill="black"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Dual Tables View -->
                    <div class="tables-container" id="normalView">
                        <!-- Purchase Table -->
                        <div class="table-section">
                            <div class="table-wrapper">
                                <div class="table-title-bar">
                                    <h2>Purchase</h2>
                                    <button class="expand-btn" onclick="expandTable('purchase')">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                            <path d="M3 3h7v2H5v5H3V3zm18 0h-7v2h5v5h2V3zM5 14H3v7h7v-2H5v-5zm14 0h2v7h-7v-2h5v-5z" fill="currentColor"/>
                                        </svg>
                                    </button>
                                </div>
                                <div class="table-content" id="purchaseTable">
                                    <!-- Purchase table will be rendered here -->
                                </div>
                            </div>
                        </div>

                        <!-- Reservation Table -->
                        <div class="table-section">
                            <div class="table-wrapper">
                                <div class="table-title-bar">
                                    <h2>Reservations</h2>
                                    <button class="expand-btn" onclick="expandTable('reservation')">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                            <path d="M3 3h7v2H5v5H3V3zm18 0h-7v2h5v5h2V3zM5 14H3v7h7v-2H5v-5zm14 0h2v7h-7v-2h5v-5z" fill="currentColor"/>
                                        </svg>
                                    </button>
                                </div>
                                <div class="table-content" id="reservationTable">
                                    <!-- Reservation table will be rendered here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Expanded View (Hidden by default) -->
                    <div class="expanded-view" id="expandedView" style="display: none;">
                        <!-- Expanded table will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
