<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gabay-Halaman</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="nav-pill">
    <div class="brand">
      <div class="logo">🌿</div>
      <span>GABAY-HALAMAN</span>
    </div>

    <nav class="nav-links">
      <a class="active">Home</a>
      <a>Account</a>
      <a>Shop</a>
      <a>More ▾</a>
    </nav>

    <div class="nav-icons">🔍 🛒</div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-image"></div>

    <div class="hero-text">
      <p class="script">Just Landed</p>
      <h1>Save 50%<br>OFF</h1>
      <button class="cta">Go shop now</button>
    </div>
  </div>

  <button class="scroll-btn">⌄</button>
</section>

<!-- TRENDING -->
<section class="trending">
  <h2>Trending Products</h2>

  <div class="pill-tabs">
    <span class="pill active">New arrival</span>
    <span class="pill">Featured</span>
    <span class="pill">Bestseller</span>
  </div>

  <div class="product-row">
    <div class="product-card">
      <div class="plant"></div>
      <h4>Mango</h4>
      <div class="stars">★★★★★</div>
    </div>

    <div class="product-card featured">
      <div class="plant"></div>
      <h4>Calamansi</h4>
      <div class="action-icons">
        <span>❤</span>
        <span>🛒</span>
        <span>👁</span>
      </div>
    </div>

    <div class="product-card">
      <div class="plant"></div>
      <h4>Berry</h4>
    </div>
  </div>
</section>

<!-- PROMOS -->
<section class="promos">
  <div class="promo left">
    <h3>Natural<br>Decor Home</h3>
    <button>Shop now</button>
  </div>

  <div class="promo right">
    <h3>Natural<br>Home Plants</h3>
    <button>Shop now</button>
  </div>
</section>

<!-- FEATURES -->
<section class="features-wrap">
  <div class="features">
    <div>🚚<br><span>Shipping</span></div>
    <div>💰<br><span>Savings</span></div>
    <div>⚡<br><span>Fast transactions</span></div>
    <div>🎧<br><span>Online support</span></div>
  </div>
</section>

</body>
</html>
