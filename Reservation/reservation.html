<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Reservation - Gabay Halaman</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- LINK CSS -->
<link rel="stylesheet" href="reservation.css">
<!-- HEADER -->
<header class="header">
  <div class="nav-pill">
    <div class="brand">
      <div class="logo">🌿</div>
      <span>GABAY-HALAMAN</span>
    </div>

    <nav class="nav-links">
      <a class="active">Home</a>
      <a>Account</a>
      <a>Shop</a>
      <a>More ▾</a>
    </nav>

    <div class="nav-icons">🔍 🛒</div>
  </div>
</header>
</head>

<body>



<div class="container">

<div class="page-header">
<h1 class="page-title">PLANT RESERVATION</h1>
</div>

<div class="content-box">

<div class="grid-container">

<!-- FORM -->
<div class="form-section">

<h2 class="section-title">Plant Selection</h2>

<div class="form-group">
<select id="category">
<option value="">Category</option>
<option value="Fruit Bearing">Fruit Bearing Trees</option>
<option value="Citrus Variety">Citrus Variety</option>
<option value="Mangga Variety">Mangga Variety</option>
<option value="Dwarf Coconut">Dwarf Coconut</option>
<option value="Cuttings/Dwarf">Cuttings/Dwarf</option>
<option value="Flowering Trees">Flowering Trees</option>
<option value="Forest Trees">Forest Trees</option>
<option value="Others">Others</option>
</select>
</div>

<div class="form-group">
<select id="plantSize">
<option value="">Select Plant Size</option>
<option value="Small">Small</option>
<option value="Large">Large</option>
<option value="Extra Large">Extra Large</option>
</select>
</div>

<div class="form-group">
<input type="number" id="quantity" placeholder="Quantity">
</div>

<div class="form-group">
<input type="date" id="deliveryDate">
</div>

<button class="reserve-btn" onclick="handleReserve()">Reserve Now</button>

</div>


<!-- PLANT DISPLAY -->
<div class="plant-section">

<div class="plant-container">
<h2 class="section-title">Available Plants</h2>

<div id="plantDisplay"></div>

</div>

</div>

</div>

</div>
</div>

<!-- LINK JAVASCRIPT -->
<script src="reservation.js"></script>

</body>
</html>
