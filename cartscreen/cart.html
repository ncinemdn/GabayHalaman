<script>

/* CART DATA */

let data = [
{ id:1, name:"Dracaena Anita", price:499, qty:1, img:"drac.png" },
{ id:2, name:"Dracaena Anita", price:499, qty:1, img:"drac.png" },
{ id:3, name:"Dracaena Anita", price:499, qty:1, img:"drac.png" }
];


/* RENDER CART */

function render(){

const container = document.getElementById("cart");

container.innerHTML = data.map(item => `

<div class="bg-[#f6f6f8] rounded-[22px] p-6 flex justify-between items-center soft-shadow">

<div class="flex items-center gap-5">

<img src="${item.img}" class="w-[100px] h-[100px] object-cover rounded-[18px]">

<div>
<h3 class="serif text-[19px] leading-tight">${item.name}</h3>
<p class="font-bold mt-1">₱ ${item.price}</p>
</div>

</div>

<div class="flex items-center gap-5">

<div class="bg-[#e5e7eb] rounded-full flex items-center px-2 py-1 h-[38px] min-w-[110px] justify-between shadow-inner">

<button onclick="qty(${item.id},-1)">-</button>

<span>${item.qty}</span>

<button onclick="qty(${item.id},1)">+</button>

</div>

<button onclick="del(${item.id})" class="text-red-500 text-xl">🗑</button>

</div>

</div>

`).join("");

update();

}


/* CHANGE QTY */

function qty(id,change){

let item = data.find(i=>i.id===id);

item.qty = Math.max(1, item.qty + change);

render();

}


/* DELETE ITEM */

function del(id){

data = data.filter(i=>i.id!==id);

render();

}


/* UPDATE TOTAL */

function update(){

let totalQty = data.reduce((a,b)=>a+b.qty,0);

let totalPrice = data.reduce((a,b)=>a+(b.price*b.qty),0);

document.getElementById("count").innerText = `Subtotal (${totalQty} items)`;

let price = "₱ " + totalPrice.toLocaleString("en-PH",{minimumFractionDigits:2});

document.getElementById("subtotal").innerText = price;

document.getElementById("total").innerText = price;

}


/* GO TO DELIVERY PAGE */

function goToDelivery(){

window.location.href = "delivery.html";

}


/* PLACE ORDER */

function placeOrder(){

window.location.href = "confirmation.html";

}


/* INITIAL RENDER */

render();

</script>
