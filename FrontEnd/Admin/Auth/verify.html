<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Account</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    <h2>Verify Your Account</h2>

    <p>Please enter the verification code sent to your email.</p>

    <!-- CODE INPUT -->
    <input type="text" id="code" placeholder="Enter verification code" />

    <!-- TIMER -->
    <p id="timerText">Code expires in: 05:00</p>

    <!-- BUTTONS -->
    <button onclick="verifyAccount()">Verify</button>
    <button id="resendBtn" type="button">Resend Code</button>

    <p id="verifyError" class="error"></p>
</div>

<!-- CONNECT YOUR JS -->
<script src="../../shared/api.js"></script>
<script src="auth.js"></script>

</body>
</html>
