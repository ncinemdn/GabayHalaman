<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowering - Gabay Halaman</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #f2f6ec; color: #1f2f14; }
        .wrap { max-width: 1300px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
        h1 { font-family: 'Inria Serif', serif; font-size: clamp(2rem, 5vw, 3.3rem); margin: 0; text-align: center; }
        .subtitle { text-align: center; margin: 0.75rem 0 2rem; font-size: 1.05rem; color: #486534; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2rem;
            justify-content: center;
            align-items: start;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d5e3c2;
            border-radius: 14px;
            padding: 0.85rem;
            box-shadow: 0 12px 22px rgba(40, 75, 20, 0.08);
            text-align: center;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 0.7rem;
            display: block;
        }
        .name { font-size: 1.12rem; min-height: 2.8rem; margin-bottom: 0.2rem; color: #1f2f14; }
        .price { font-weight: 600; color: #365821; }
        .card { text-decoration: none; color: inherit; display: flex; flex-direction: column; cursor: pointer; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(40, 75, 20, 0.15); }
        .actions { display: flex; justify-content: center; margin-top: 2rem; }
        .btn { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 999px; text-decoration: none; background: #3c5830; color: #fff; font-weight: 700; }
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Flowering Trees</h1>
        <p class="subtitle">Beautiful flowering varieties with aligned cards and wider spacing for easier browsing.</p>

        <section class="grid" aria-label="Flowering plants">
            <a href="../product-detail.html?id=55" class="card"><img src="https://images.unsplash.com/photo-1689790733141-9b4ef8ed1bc4?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Golden Trumpet"><h2 class="name">Golden Trumpet</h2><p class="price">₱700.00</p></a>
            <a href="../product-detail.html?id=56" class="card"><img src="https://images.unsplash.com/photo-1760135638379-0e749e10c1b0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Pink Trumpet"><h2 class="name">Pink Trumpet</h2><p class="price">₱800.00</p></a>
            <a href="../product-detail.html?id=57" class="card"><img src="https://images.unsplash.com/photo-1683613791927-660d0ed2d86f?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Golden Shower"><h2 class="name">Golden Shower</h2><p class="price">₱900.00</p></a>
            <a href="../product-detail.html?id=58" class="card"><img src="https://images.unsplash.com/photo-1683356478048-ea3261e194b1?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Fire Tree"><h2 class="name">Fire Tree</h2><p class="price">₱1,200.00</p></a>
            <a href="../product-detail.html?id=59" class="card"><img src="https://images.unsplash.com/photo-1552017650-c117c3535f68?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Ilang Ilang"><h2 class="name">Ilang Ilang</h2><p class="price">₱700.00</p></a>
            <a href="../product-detail.html?id=60" class="card"><img src="https://images.unsplash.com/photo-1695389591261-ee471f900c62?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Jacaranda"><h2 class="name">Jacaranda</h2><p class="price">₱1,000.00</p></a>
        </section>

        <div class="actions">
            <a class="btn" href="../../LandingPage/landingpage.html">Back to Home</a>
        </div>
    </div>
</body>
</html>
