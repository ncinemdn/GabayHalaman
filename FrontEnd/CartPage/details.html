<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Details - Gabay Halaman</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gh-olive-900: #1f3419;
            --gh-olive-700: #375728;
            --gh-olive-500: #6f9954;
            --gh-bg-soft: #eef3e8;
            --gh-surface: #ffffff;
            --gh-border: #d9e1d2;
            --gh-text: #1d241d;
            --gh-muted: #6e7a6d;
            --gh-danger: #b42318;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--gh-text);
            background:
                radial-gradient(circle at 8% 10%, rgba(146, 183, 112, 0.2), transparent 34%),
                radial-gradient(circle at 92% 14%, rgba(190, 214, 165, 0.35), transparent 36%),
                linear-gradient(180deg, #f8fbf5 0%, #eef4eb 100%);
        }

        .details-save-toast-stack {
            position: fixed;
            top: 96px;
            right: 24px;
            z-index: 1350;
            pointer-events: none;
        }

        .details-save-toast {
            position: relative;
            width: min(360px, calc(100vw - 32px));
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            padding: 0.95rem 1rem 1rem;
            border-radius: 18px;
            border: 1px solid rgba(126, 163, 61, 0.3);
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 18px 32px rgba(26, 42, 20, 0.16);
            backdrop-filter: blur(10px);
            overflow: hidden;
            opacity: 0;
            transform: translate3d(16px, -8px, 0);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .details-save-toast.is-visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .details-save-toast-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #4b6a2b;
            background: linear-gradient(145deg, #edf6df, #f8fbf2);
            border: 1px solid rgba(126, 163, 61, 0.3);
        }

        .details-save-toast-badge svg {
            width: 18px;
            height: 18px;
        }

        .details-save-toast-copy {
            min-width: 0;
            flex: 1;
        }

        .details-save-toast-title {
            font-family: 'Inria Serif', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #213319;
        }

        .details-save-toast-text {
            margin-top: 0.16rem;
            font-size: 0.82rem;
            line-height: 1.45;
            color: #5c6d53;
        }

        .details-save-toast-progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: linear-gradient(90deg, #7ea33d, #b8cf87);
            transform-origin: left center;
        }

        @keyframes detailsSaveToastCountdown {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        /* Header (Landing exact style) */
        .header {
            background: rgba(104, 150, 84, 0.3);
            padding: 14px 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1200;
            transition: background-color 0.25s ease, backdrop-filter 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            border-bottom: 1px solid transparent;
        }

        .header.is-scrolled {
            background: rgba(78, 125, 62, 0.68);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 6px 22px rgba(37, 69, 24, 0.32);
            border-bottom-color: rgba(255, 255, 255, 0.24);
        }

        .header-inner {
            background-color: transparent;
            border-radius: 0;
            padding: 8px 28px;
            max-width: 1340px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
            align-items: center;
            column-gap: 20px;
            box-shadow: none;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-self: start;
            gap: 12px;
            text-decoration: none;
            border-radius: 999px;
            padding: 4px 10px 4px 4px;
            transition: background-color 0.2s ease;
        }

        .logo-section:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-text {
            height: 24px;
            width: auto;
            display: block;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-self: center;
            gap: 34px;
        }

        .nav a {
            font-family: 'Inria Serif', serif;
            font-weight: 700;
            font-size: 18px;
            color: #132710;
            text-decoration: none;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .nav a:hover {
            opacity: 0.6;
        }

        .nav-dropdown {
            position: relative;
        }

        .nav-dropdown-toggle {
            font-family: 'Inria Serif', serif;
            font-weight: 700;
            font-size: 18px;
            color: #132710;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .nav-dropdown-toggle:hover {
            opacity: 0.6;
        }

        .nav-dropdown-menu {
            display: block;
            position: absolute;
            top: calc(100% + 5px);
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            min-width: 170px;
            background: rgba(249, 255, 245, 0.98);
            border-radius: 12px;
            border: 1px solid rgba(102, 146, 83, 0.2);
            box-shadow: 0 10px 24px rgba(20, 49, 12, 0.18);
            padding: 10px 0;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
        }

        .nav-dropdown-menu a {
            display: block;
            padding: 10px 16px;
            font-size: 16px;
            white-space: nowrap;
            pointer-events: auto;
        }

        .nav-dropdown.is-open .nav-dropdown-menu {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .cart-dropdown-menu {
            left: auto;
            right: 0;
            transform: translateY(8px);
            min-width: 170px;
        }

        .nav-dropdown.cart-dropdown.is-open .cart-dropdown-menu {
            transform: translateY(0);
        }

        .header-icons {
            display: flex;
            align-items: center;
            justify-self: end;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.26);
            border-radius: 999px;
            padding: 3px 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .icon-btn svg path {
            fill: #132710;
            transition: fill 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.34);
            transform: translateY(-1px);
        }

        .icon-btn:hover svg path {
            fill: #0c1a08;
        }

        /* Main Container */
        .container {
            max-width: 980px;
            margin: 0 auto;
            margin-top: 106px;
            padding: 1.25rem 1rem 2rem;
        }

        .page-shell {
            border: 1px solid #d8e2d2;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 34px rgba(26, 42, 20, 0.1);
            background: var(--gh-surface);
        }

        .page-hero {
            background: linear-gradient(140deg, var(--gh-olive-900), #2f4b22 52%, #456d33 100%);
            padding: 1rem 1.2rem;
            color: #f4f9f1;
        }

        .page-kicker {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.8;
        }

        .form-title {
            font-family: 'Inria Serif', serif;
            font-weight: 700;
            font-size: 1.55rem;
            color: #f7fbf5;
            margin-top: 0.2rem;
        }

        .page-subtitle {
            font-size: 0.84rem;
            margin-top: 0.3rem;
            opacity: 0.85;
        }

        .form-container {
            background: linear-gradient(180deg, #f9fcf6 0%, #f2f7ef 100%);
            padding: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-group.wide {
            grid-column: span 2;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            color: #2f372d;
            margin-bottom: 0.35rem;
        }

        .form-input {
            width: 100%;
            padding: 0.72rem 0.88rem;
            border: 1px solid #c7d2bf;
            border-radius: 10px;
            background: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: #263124;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gh-olive-700);
            box-shadow: 0 0 0 3px rgba(92, 136, 66, 0.16);
        }

        .form-input::placeholder {
            color: #849083;
        }

        .form-input.has-error {
            border-color: #cf2b3e;
            box-shadow: 0 0 0 3px rgba(207, 43, 62, 0.14);
        }

        #validIDFile {
            display: none;
        }

        .file-upload-label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.46rem 0.8rem;
            border: 1px dashed #89a779;
            border-radius: 999px;
            background: #f5faef;
            color: #2f531f;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .file-upload-label:hover {
            background: #ecf5e2;
            transform: translateY(-1px);
        }

        .file-upload-label.has-error {
            border-color: #cf2b3e;
            background: #fff1f3;
            color: #a31f30;
        }

        .uploaded-file-name {
            display: none;
            margin-top: 0.35rem;
            font-size: 0.76rem;
            color: #3d6e29;
            font-weight: 600;
        }

        .form-note {
            min-height: 1em;
            margin-top: 0.28rem;
            font-size: 0.73rem;
            line-height: 1.2;
            color: transparent;
        }

        .form-note.error {
            color: #b42318;
            font-weight: 500;
        }

        .form-buttons {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 0.95rem;
            grid-column: span 2;
        }

        .btn {
            padding: 0.58rem 1.25rem;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            min-width: 108px;
        }

        .btn-cancel {
            background-color: #f9ecef;
            color: var(--gh-danger);
            border: 1px solid #e8bcc4;
        }

        .btn-cancel:hover {
            background-color: #f7e1e6;
            transform: translateY(-1px);
        }

        .btn-save {
            background: linear-gradient(145deg, #355625, #4e7538);
            color: white;
            box-shadow: 0 8px 16px rgba(52, 87, 36, 0.22);
        }

        .btn-save:hover {
            opacity: 0.94;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container {
                margin-top: 92px;
                padding: 0.95rem 0.72rem 1.5rem;
            }

            .details-save-toast-stack {
                top: 84px;
                right: 12px;
                left: 12px;
            }

            .details-save-toast {
                width: 100%;
            }

            .header-inner {
                padding: 8px 14px;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .nav {
                display: none;
            }

            .form-title {
                font-size: 1.28rem;
            }

            .page-subtitle {
                font-size: 0.8rem;
            }

            .form-container {
                padding: 0.82rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.wide,
            .form-buttons {
                grid-column: span 1;
            }

            .form-buttons {
                justify-content: stretch;
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>

    <!-- Main Content -->
    <div class="container">
        <div class="page-shell">
            <div class="page-hero">
                <p class="page-kicker">Checkout Step</p>
                <h1 class="form-title">Delivery Details</h1>
                <p class="page-subtitle">Fill in your information to continue with a safe and accurate delivery.</p>
            </div>

            <div class="form-container">
            <form id="deliveryForm" onsubmit="handleSave(event)" class="form-grid">
                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="fullName" placeholder="Enter your name" required>
                    <p class="form-note" id="fullNameNote"></p>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
                    <p class="form-note" id="emailNote"></p>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-input" id="phone" placeholder="Enter your phone number" required>
                    <p class="form-note" id="phoneNote"></p>
                </div>

                <!-- Address -->
                <div class="form-group wide">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-input" id="address" placeholder="Insert address for delivery" required>
                    <p class="form-note" id="addressNote"></p>
                </div>

                <!-- Valid ID -->
                <div class="form-group wide">
                    <label class="form-label">Valid ID</label>
                    <label class="file-upload-label" id="fileUploadLabel" onclick="document.getElementById('validIDFile').click()">
                        <span>Upload a file here</span>
                    </label>
                    <input type="file" id="validIDFile" accept=".pdf,.jpg,.jpeg,.png" onchange="handleFileUpload(event)">
                    <div class="uploaded-file-name" id="fileName"></div>
                    <p class="form-note" id="validIDNote"></p>
                </div>

                <!-- Buttons -->
                <div class="form-buttons">
                    <button type="button" class="btn btn-cancel" onclick="handleCancel()">Cancel</button>
                    <button type="submit" class="btn btn-save">Save</button>
                </div>
            </form>
            </div>
        </div>
    </div>

    <div id="detailsSaveToastRegion" class="details-save-toast-stack" aria-live="polite" aria-atomic="true"></div>

    <script>
        const FIELD_CONFIG = {
            fullName: { noteId: 'fullNameNote', label: 'Full name' },
            email: { noteId: 'emailNote', label: 'Email' },
            phone: { noteId: 'phoneNote', label: 'Phone number' },
            address: { noteId: 'addressNote', label: 'Address' }
        };

        const SAVE_TOAST_DURATION = 1800;
        const MAX_VALID_ID_FILE_SIZE = 2 * 1024 * 1024;
        const detailsSaveToastRegion = document.getElementById('detailsSaveToastRegion');

        let saveRedirectTimeout = null;
        let saveToastHideTimeout = null;
        let saveToastRemoveTimeout = null;
        let isSaveRedirecting = false;

        function getSavedDeliveryDetails() {
            try {
                return JSON.parse(localStorage.getItem('deliveryDetails') || '{}') || {};
            } catch (error) {
                console.warn('Unable to parse saved delivery details:', error);
                return {};
            }
        }

        function getSelectedValidIdFile() {
            const idFileInput = document.getElementById('validIDFile');
            return idFileInput && idFileInput.files && idFileInput.files[0] ? idFileInput.files[0] : null;
        }

        function hasPersistedValidId(details) {
            return Boolean(details && details.validIdAttachment);
        }

        function updateValidIdFileName(name, sourceLabel) {
            const fileName = document.getElementById('fileName');

            if (!fileName) {
                return;
            }

            if (!name) {
                fileName.textContent = '';
                fileName.style.display = 'none';
                return;
            }

            fileName.textContent = sourceLabel + ': ' + name;
            fileName.style.display = 'block';
        }

        function getValidIdContentType(file) {
            const explicitType = String(file && file.type || '').trim();
            if (explicitType) {
                return explicitType;
            }

            const fileName = String(file && file.name || '').toLowerCase();
            if (fileName.endsWith('.pdf')) {
                return 'application/pdf';
            }

            if (fileName.endsWith('.png')) {
                return 'image/png';
            }

            return 'image/jpeg';
        }

        function validateValidIdFile(file) {
            if (!file) {
                return 'Please upload a valid ID before saving.';
            }

            const fileName = String(file.name || '').toLowerCase();
            const isSupportedType = /\.(pdf|jpg|jpeg|png)$/i.test(fileName);

            if (!isSupportedType) {
                return 'Please upload a PDF, JPG, JPEG, or PNG file.';
            }

            if (Number(file.size || 0) > MAX_VALID_ID_FILE_SIZE) {
                return 'Please upload a valid ID file smaller than 2 MB.';
            }

            return '';
        }

        function readFileAsDataUrl(file) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();

                reader.onload = function() {
                    resolve(String(reader.result || ''));
                };

                reader.onerror = function() {
                    reject(new Error('Unable to read the selected valid ID file.'));
                };

                reader.readAsDataURL(file);
            });
        }

        function getReturnPage() {
            const params = new URLSearchParams(window.location.search);
            const returnTarget = String(params.get('return') || '').trim().toLowerCase();

            if (returnTarget === 'order-now') {
                return 'order-now.html';
            }

            return 'cart.html';
        }

        function setFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const config = FIELD_CONFIG[fieldId];
            const note = config ? document.getElementById(config.noteId) : null;

            if (field) {
                field.classList.toggle('has-error', Boolean(message));
            }

            if (note) {
                note.textContent = message || '';
                note.classList.toggle('error', Boolean(message));
            }
        }

        function setValidIdError(message) {
            const note = document.getElementById('validIDNote');
            const fileLabel = document.getElementById('fileUploadLabel');

            if (note) {
                note.textContent = message || '';
                note.classList.toggle('error', Boolean(message));
            }

            if (fileLabel) {
                fileLabel.classList.toggle('has-error', Boolean(message));
            }
        }

        function clearValidationMessages() {
            Object.keys(FIELD_CONFIG).forEach(function(fieldId) {
                setFieldError(fieldId, '');
            });
            setValidIdError('');
        }

        function validateDeliveryForm() {
            clearValidationMessages();

            const fullName = String(document.getElementById('fullName').value || '').trim();
            const email = String(document.getElementById('email').value || '').trim();
            const phone = String(document.getElementById('phone').value || '').trim();
            const address = String(document.getElementById('address').value || '').trim();
            const savedDetails = getSavedDeliveryDetails();
            const hasValidID = Boolean(getSelectedValidIdFile() || hasPersistedValidId(savedDetails));

            let isValid = true;

            if (!fullName) {
                setFieldError('fullName', 'Please enter your full name.');
                isValid = false;
            }

            if (!email) {
                setFieldError('email', 'Please enter your email address.');
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setFieldError('email', 'Please enter a valid email format.');
                isValid = false;
            }

            if (!phone) {
                setFieldError('phone', 'Please enter your phone number.');
                isValid = false;
            }

            if (!address) {
                setFieldError('address', 'Please enter your delivery address.');
                isValid = false;
            }

            if (!hasValidID) {
                setValidIdError('Please upload a valid ID before saving.');
                isValid = false;
            }

            if (!isValid) {
                return null;
            }

            return {
                fullName,
                email,
                phone,
                address
            };
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            setValidIdError('');

            if (file) {
                const validationMessage = validateValidIdFile(file);
                if (validationMessage) {
                    event.target.value = '';
                    setValidIdError(validationMessage);

                    const savedDetails = getSavedDeliveryDetails();
                    if (savedDetails.validIdFileName && hasPersistedValidId(savedDetails)) {
                        updateValidIdFileName(savedDetails.validIdFileName, 'Saved ID');
                    } else {
                        updateValidIdFileName('', '');
                    }
                    return;
                }

                updateValidIdFileName(file.name, 'Selected ID');
            } else {
                const savedDetails = getSavedDeliveryDetails();
                if (savedDetails.validIdFileName && hasPersistedValidId(savedDetails)) {
                    updateValidIdFileName(savedDetails.validIdFileName, 'Saved ID');
                } else {
                    updateValidIdFileName('', '');
                }
            }
        }

        async function buildDeliveryDetailsPayload(deliveryDetails) {
            const selectedFile = getSelectedValidIdFile();
            const savedDetails = getSavedDeliveryDetails();
            const payload = {
                ...deliveryDetails
            };

            if (selectedFile) {
                const validationMessage = validateValidIdFile(selectedFile);
                if (validationMessage) {
                    setValidIdError(validationMessage);
                    return null;
                }

                try {
                    payload.validIdAttachment = await readFileAsDataUrl(selectedFile);
                } catch (error) {
                    console.error(error);
                    setValidIdError('Unable to save the selected valid ID. Please try again.');
                    return null;
                }

                payload.validIdFileName = selectedFile.name;
                payload.validIdContentType = getValidIdContentType(selectedFile);
            } else if (hasPersistedValidId(savedDetails)) {
                payload.validIdAttachment = savedDetails.validIdAttachment;
                payload.validIdFileName = savedDetails.validIdFileName || '';
                payload.validIdContentType = savedDetails.validIdContentType || '';
            }

            payload.hasValidID = Boolean(payload.validIdAttachment);
            return payload;
        }

        function showSaveToast() {
            if (!detailsSaveToastRegion) {
                return;
            }

            window.clearTimeout(saveToastHideTimeout);
            window.clearTimeout(saveToastRemoveTimeout);

            detailsSaveToastRegion.innerHTML = '';

            const toast = document.createElement('section');
            toast.className = 'details-save-toast';
            toast.setAttribute('role', 'status');
            toast.innerHTML = `
                <div class="details-save-toast-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M7 12.5L10.1 15.6L17.25 8.45" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="details-save-toast-copy">
                    <p class="details-save-toast-title">Details saved</p>
                    <p class="details-save-toast-text">Your delivery details were saved successfully.</p>
                </div>
                <div class="details-save-toast-progress"></div>
            `;

            detailsSaveToastRegion.appendChild(toast);

            requestAnimationFrame(function() {
                toast.classList.add('is-visible');
                const progressBar = toast.querySelector('.details-save-toast-progress');
                if (progressBar) {
                    progressBar.style.animation = `detailsSaveToastCountdown ${SAVE_TOAST_DURATION}ms linear forwards`;
                }
            });

            saveToastHideTimeout = window.setTimeout(function() {
                toast.classList.remove('is-visible');
                saveToastRemoveTimeout = window.setTimeout(function() {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 220);
            }, SAVE_TOAST_DURATION);
        }

        async function handleSave(event) {
            event.preventDefault();

            if (isSaveRedirecting) {
                return;
            }

            const deliveryDetails = validateDeliveryForm();
            if (!deliveryDetails) {
                return;
            }

            const payload = await buildDeliveryDetailsPayload(deliveryDetails);
            if (!payload) {
                return;
            }

            try {
                localStorage.setItem('deliveryDetails', JSON.stringify(payload));
            } catch (error) {
                console.error('Unable to save delivery details:', error);
                setValidIdError('Unable to save the valid ID. Please use a smaller file.');
                return;
            }

            isSaveRedirecting = true;
            showSaveToast();

            window.clearTimeout(saveRedirectTimeout);
            saveRedirectTimeout = window.setTimeout(function() {
                window.location.href = getReturnPage();
            }, SAVE_TOAST_DURATION);
        }

        function handleCancel() {
            if (confirm('Are you sure you want to cancel? Any unsaved changes will be lost.')) {
                window.location.href = getReturnPage();
            }
        }

        function initializeStickyHeaderBlur() {
            const header = document.querySelector('.header');
            if (!header) {
                return;
            }

            function syncHeaderState() {
                header.classList.toggle('is-scrolled', window.scrollY > 10);
            }

            syncHeaderState();
            window.addEventListener('scroll', syncHeaderState, { passive: true });
        }

        // Load saved details if they exist
        window.addEventListener('DOMContentLoaded', function() {
            initializeStickyHeaderBlur();

            Object.keys(FIELD_CONFIG).forEach(function(fieldId) {
                const field = document.getElementById(fieldId);
                if (!field) {
                    return;
                }

                field.addEventListener('input', function() {
                    setFieldError(fieldId, '');
                });
            });

            const details = getSavedDeliveryDetails();
            if (Object.keys(details).length) {
                document.getElementById('fullName').value = details.fullName || '';
                document.getElementById('email').value = details.email || '';
                document.getElementById('phone').value = details.phone || '';
                document.getElementById('address').value = details.address || '';

                if (details.validIdFileName && hasPersistedValidId(details)) {
                    updateValidIdFileName(details.validIdFileName, 'Saved ID');
                }
            }
        });
    </script>
