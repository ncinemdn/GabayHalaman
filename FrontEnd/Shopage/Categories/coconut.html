        .header-inner { background-color: #ffffff; border-radius: 50px; padding: 12px 28px; max-width: 1300px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); }
        .logo-section { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .brand-text { height: 24px; }
        .nav { display: flex; gap: 40px; }
        .nav a { font-family: 'Inria Serif', serif; font-weight: 700; font-size: 18px; color: black; text-decoration: none; transition: 0.2s; }
        .nav a:hover { opacity: 0.6; }
        .nav-dropdown { position: relative; }
        .nav-dropdown-toggle { font-family: 'Inria Serif', serif; font-weight: 700; font-size: 18px; color: black; background: none; border: none; cursor: pointer; padding: 0; }
        .nav-dropdown-menu { display: none; position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); min-width: 180px; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); padding: 10px 0; z-index: 1000; }
        .nav-dropdown-menu a { display: block; padding: 10px 16px; font-size: 16px; white-space: nowrap; }
        .nav-dropdown:hover .nav-dropdown-menu { display: block; }
        .wrap { max-width: 1300px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        h1 { font-family: 'Inria Serif', serif; font-size: clamp(2rem, 5vw, 3.3rem); margin: 0; text-align: center; }
        .subtitle { text-align: center; margin: 0.75rem 0 2rem; font-size: 1.05rem; color: #486534; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2rem;
            justify-content: center;
            align-items: start;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d5e3c2;
            border-radius: 14px;
            padding: 0.85rem;
            box-shadow: 0 12px 22px rgba(40, 75, 20, 0.08);
            text-align: center;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 0.7rem;
            display: block;
        }
        .name { font-size: 1.12rem; min-height: 2.8rem; margin-bottom: 0.2rem; color: #1f2f14; }
        .price { font-weight: 600; color: #365821; }
        .card { text-decoration: none; color: inherit; display: flex; flex-direction: column; cursor: pointer; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(40, 75, 20, 0.15); }
        .actions { display: flex; justify-content: center; margin-top: 2rem; }
        .btn { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 999px; text-decoration: none; background: #3c5830; color: #fff; font-weight: 700; }
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; }
        }
        @media (max-width: 600px) {
            .nav { display: none; }
            .header-inner { padding: 1rem 1.5rem; border-radius: 30px; }
            .logo { width: 56px; height: 56px; }
            .grid { grid-template-columns: 1fr; }
        }
